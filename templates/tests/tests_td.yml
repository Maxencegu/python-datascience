name: Tests TD

on:
  push:
    branches: ['dev_td*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install nbformat nbconvert ipykernel numpy "pandas>=2.0,<3.0" matplotlib seaborn scipy

      - name: Détecter le TD depuis le nom de la branche
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH=$GITHUB_HEAD_REF
          else
            BRANCH=${GITHUB_REF#refs/heads/}
          fi
          echo "TD=${BRANCH#dev_}" >> $GITHUB_ENV

      - name: Télécharger les fichiers de test
        run: |
          BASE="https://raw.githubusercontent.com/Maxencegu/python-datascience-l3/main/templates/tests"
          curl -f -o run_tests.py "$BASE/run_tests.py"
          if ! curl -f -o expected.json "$BASE/${TD}_expected.json"; then
            echo "⚠️ Aucun fichier de test trouvé pour ${TD} — tests ignorés"
            exit 0
          fi

      - name: Lancer les tests
        run: python run_tests.py "${TD}_enonce.ipynb" expected.json
